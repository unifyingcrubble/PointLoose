name: Build PointLoose.exe

on:
  workflow_dispatch:        # test build from the Actions tab; releases come from release.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project folder
        shell: bash
        run: |
          f=$(find . -name pointloose_app.py -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then echo "pointloose_app.py not found in repo"; find . -not -path './.git/*' | head -50; exit 1; fi
          echo "APP_DIR=$(dirname "$f")" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --upgrade pip -r requirements.txt
          python make_version_info.py
      - working-directory: ${{ env.APP_DIR }}
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --collect-submodules bleak --collect-submodules winrt --name PointLoose --icon pointloose.ico --version-file version_info.txt --add-data "pointloose.ico;." --add-data "README.md;." --add-data "EULA.md;." --add-data "PRIVACY.md;." --add-data "SECURITY.md;." --add-data "LICENSE;." --add-data "THIRD_PARTY_NOTICES.md;." pointloose_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: PointLoose-windows
          path: ${{ env.APP_DIR }}/dist/PointLoose.exe
