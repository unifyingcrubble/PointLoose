name: Build PointLoose.ipa

on:
  workflow_dispatch:        # run it from the Actions tab
  push:
    tags: ["ios-v*"]        # or push a tag like ios-v1.0

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder
        run: |
          f=$(find . -name project.yml -path '*ios*' -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then echo "ios/project.yml not found in repo"; find . -not -path './.git/*' | head -50; exit 1; fi
          echo "IOS_DIR=$(dirname "$f")" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ env.IOS_DIR }}
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ${{ env.IOS_DIR }}
        run: |
          xcodebuild \
            -project PointLoose.xcodeproj \
            -scheme PointLoose \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ${{ env.IOS_DIR }}
        run: |
          rm -rf Payload PointLoose.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PointLoose.app Payload/
          zip -qry PointLoose.ipa Payload
          ls -lh PointLoose.ipa

      # Direct .ipa download (no zip inside a zip). Needs upload-artifact v7.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.IOS_DIR }}/PointLoose.ipa
          archive: false

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ios-build-{0}', github.run_number) }}
          name: PointLoose iOS ${{ github.run_number }}
          files: ${{ env.IOS_DIR }}/PointLoose.ipa
